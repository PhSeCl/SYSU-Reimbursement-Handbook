name: Build handbook

on:
  push:
    branches: [main]
    paths:
      - 'latex/**'
      - 'assets/redacted/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/build-handbook.yml'
  pull_request:
    paths:
      - 'latex/**'
      - 'assets/redacted/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/build-handbook.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: handbook-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: XeLaTeX on Windows
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Check system fonts
        run: |
          $fontRoot = Join-Path $env:WINDIR 'Fonts'
          foreach ($font in @('simsun.ttc', 'georgia.ttf', 'calibri.ttf', 'consola.ttf', 'times.ttf')) {
            if (-not (Test-Path -LiteralPath (Join-Path $fontRoot $font))) {
              throw "Required system font is missing: $font"
            }
            Write-Output "Available system font: $font"
          }

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: '3.12'
          enable-cache: true

      - name: Set up TeX Live
        uses: r-lib/actions/setup-tinytex@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        env:
          TINYTEX_VERSION: '2026.11'
          TINYTEX_INSTALLER: TinyTeX

      - name: Install LaTeX packages
        run: |
          tlmgr update --self
          if ($LASTEXITCODE -ne 0) { throw 'TeX Live manager update failed' }
          tlmgr install ctex xecjk fontspec tcolorbox pgf environ trimspaces listings geometry fancyhdr enumitem booktabs needspace hyperref tools colortbl caption varwidth tikzfill pdfcol latexmk
          if ($LASTEXITCODE -ne 0) { throw 'LaTeX package installation failed' }
          xelatex --version

      - name: Install locked Python dependencies
        run: uv sync --locked

      - name: Build and validate PDFs
        run: |
          $ErrorActionPreference = 'Stop'
          $repoRoot = $PWD.Path
          function Build-Tex($source, $build) {
            $buildPath = Join-Path $repoRoot $build
            New-Item -ItemType Directory -Force $buildPath | Out-Null
            Push-Location (Join-Path $repoRoot $source)
            try {
              & latexmk -norc -xelatex -interaction=nonstopmode -halt-on-error "-outdir=$buildPath" main.tex *> "$buildPath/build-console.log"
              if ($LASTEXITCODE -ne 0) {
                Get-Content "$buildPath/build-console.log" -Tail 40
                throw "Compilation failed: $source"
              }
            } finally { Pop-Location }
          }
          New-Item -ItemType Directory -Force latex/images, output/pdf | Out-Null
          $examples = @{
            'reimbursement-summary' = 'tmp/latex-summary'
            'cross-campus-summary' = 'tmp/latex-training-summary'
          }
          foreach ($name in $examples.Keys) {
            Build-Tex "latex/examples/$name" $examples[$name]
            Copy-Item "$($examples[$name])/main.pdf" "latex/images/$name.pdf" -Force
            Build-Tex "latex/forms/$name" "tmp/latex-form-$name"
            uv run --no-sync scripts/prepare-pdf-form.py "tmp/latex-form-$name/main.pdf" "output/pdf/$name-form.pdf"
            if ($LASTEXITCODE -ne 0) { throw "Form preparation failed: $name" }
          }
          Build-Tex latex tmp/latex
          foreach ($check in @('verify-latex.py', 'verify-pdf-forms.py')) {
            uv run --no-sync "scripts/$check"
            if ($LASTEXITCODE -ne 0) { throw "PDF validation failed: $check" }
          }
          Copy-Item tmp/latex/main.pdf output/pdf/SYSU-Reimbursement-Handbook.pdf -Force

      - name: Upload PDFs
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: handbook-pdfs
          path: |
            output/pdf/SYSU-Reimbursement-Handbook.pdf
            output/pdf/reimbursement-summary-form.pdf
            output/pdf/cross-campus-summary-form.pdf
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: handbook-build-logs
          path: |
            tmp/**/*.log
            tmp/**/pdf-audit.json
          if-no-files-found: ignore
          retention-days: 7
